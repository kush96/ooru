name: civic-backend

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ooru
      POSTGRES_USER: ooru
      POSTGRES_PASSWORD: ooru_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    external: true
    name: civic-backend_postgres_data
